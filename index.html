<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>App Warming Up</title>

<style>
  body {
    margin: 0;
    background: #0f1115;
    color: #e6e7ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Arial", sans-serif;
    height: 100vh;
    text-align: center;
    overflow: hidden;
  }

  .fade-in {
    animation: fade 2s ease forwards;
    opacity: 0;
  }

  @keyframes fade {
    to { opacity: 1; }
  }

  .glow {
    font-size: 1.8rem;
    font-weight: bold;
    animation: glowPulse 2.5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 4px #7aa2ff; }
    50% { text-shadow: 0 0 16px #7aa2ff; }
    100% { text-shadow: 0 0 4px #7aa2ff; }
  }

  .subtext {
    margin-top: 14px;
    font-size: 1.1rem;
    color: #9aa3b2;
    animation: fade 3s ease forwards;
    opacity: 0;
  }

  /* Bouncing dots loader */
  .loader {
    display: flex;
    gap: 8px;
    margin-top: 38px;
  }

  .dot {
    width: 12px;
    height: 12px;
    background: #7aa2ff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-12px); }
  }
</style>
</head>

<body>
  <div class="fade-in glow">Please wait till closer to the event</div>
  <div class="subtext">We are warming up the app to ensure you get the best experience</div>

  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
