<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App Warming Up</title>

<style>
  body {
    margin: 0;
    background: #0f1115;
    color: #e6e7ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Arial", sans-serif;
    height: 100vh;
    text-align: center;
    overflow: hidden;
    padding: 20px;
  }

  /* Always visible heading */
  .glow {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: bold;
    text-shadow: 0 0 4px #7aa2ff;
    animation: glowPulse 2.5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 5px #7aa2ff; }
    50% { text-shadow: 0 0 20px #7aa2ff; }
    100% { text-shadow: 0 0 5px #7aa2ff; }
  }

  /* Fade-in paragraph */
  .subtext {
    margin-top: 16px;
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: #9aa3b2;
    opacity: 0;
    animation: fade 2s ease forwards;
    animation-delay: 0.5s;
  }

  @keyframes fade {
    to { opacity: 1; }
  }

  /* Loader */
  .loader {
    display: flex;
    gap: 10px;
    margin-top: 40px;
  }

  .dot {
    width: 14px;
    height: 14px;
    background: #7aa2ff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-14px); }
  }
</style>
</head>

<body>
  <div class="glow">Please wait till closer to the event</div>

  <div class="subtext">
    We are just putting the final touches on the app to ensure you get the best experience
  </div>

  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
